<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常 · 本地任务</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><main><header><div><p class="eyebrow">LOCAL FIRST / 本地运行</p><h1>把重复的事，交给日常。</h1><p class="intro">管理网页签到和每日任务。登录状态保存在这台电脑，遇到验证时由你接手。</p></div><span class="pill">● 本机服务</span></header><div id="notice" role="status" aria-live="polite"></div><section class="toolbar"><div><h2>我的任务</h2><p>关闭管理页面后服务仍可调度；电脑休眠或服务停止时不会执行。</p></div><button id="add">＋ 添加任务</button></section><section id="tasks" class="cards"></section><section class="history"><h2>最近执行</h2><div class="table-wrap"><table><thead><tr><th>任务</th><th>时间</th><th>结果</th><th>步骤</th></tr></thead><tbody id="runs"></tbody></table></div></section><footer>认证内容加密存于本机 · 无云端模型 · 无外部推送 · 每个周期自动尝试一次</footer></main><dialog id="editor"><form id="task-form"><div class="dialog-heading"><h2>配置任务</h2><button type="button" id="close" class="quiet">关闭</button></div><p>首版用流程 JSON 接入站点。密码、Cookie 和令牌不要写在这里，请使用“登录”。保存后默认建议先手动试运行。</p><textarea id="config" aria-label="任务配置 JSON" spellcheck="false" required></textarea><p id="form-error" class="error" role="alert"></p><button type="submit">保存任务</button></form></dialog></body></html>
